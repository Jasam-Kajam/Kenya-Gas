<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>

        Administrator Login | Kenya Gas Marketplace

    </title>

    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">

    <!-- Google Fonts -->

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Admin CSS -->

    <link
        rel="stylesheet"
        href="assets/css/admin.css">

    <style>

        body{

            font-family:'Poppins',sans-serif;

            background:#f5f7fb;

            min-height:100vh;

            display:flex;

            align-items:center;

            justify-content:center;

        }

        .login-card{

            width:100%;

            max-width:460px;

            border:none;

            border-radius:20px;

            overflow:hidden;

        }

        .login-header{

            background:linear-gradient(135deg,#0d6efd,#198754);

            color:#fff;

            text-align:center;

            padding:35px;

        }

        .login-logo{

            width:85px;

            height:85px;

            object-fit:contain;

            margin-bottom:15px;

        }

        .form-control{

            height:52px;

        }

        .password-wrapper{

            position:relative;

        }

        .password-toggle{

            position:absolute;

            top:50%;

            right:15px;

            transform:translateY(-50%);

            cursor:pointer;

        }

    </style>

</head>

<body>

<div class="container">

<div class="row justify-content-center">

<div class="col-lg-5 col-md-7">

<div class="card shadow-lg login-card">

<!-- =======================================
     Header
======================================= -->

<div class="login-header">

<img

    src="assets/images/logo.png"

    alt="Kenya Gas"

    class="login-logo">

<h3 class="fw-bold mb-2">

Kenya Gas Marketplace

</h3>

<p class="mb-0">

Administrator Control Panel

</p>

</div>

<!-- =======================================
     Login Form
======================================= -->

<div class="card-body p-4">

<form id="adminLoginForm">

<div class="mb-3">

<label class="form-label">

Administrator Email

</label>

<input

id="email"

type="email"

class="form-control"

placeholder="admin@example.com"

required>

</div>

<div class="mb-3">

<label class="form-label">

Password

</label>

<div class="password-wrapper">

<input

id="password"

type="password"

class="form-control"

placeholder="Enter password"

required>

<i

id="togglePassword"

class="bi bi-eye password-toggle">

</i>

</div>

</div>

<div class="d-flex justify-content-between align-items-center mb-4">

<div class="form-check">

<input

id="rememberMe"

type="checkbox"

class="form-check-input">

<label

class="form-check-label"

for="rememberMe">

Remember Me

</label>

</div>

<a

href="#"

id="forgotPasswordLink"

class="text-decoration-none">

Forgot Password?

</a>

</div>

<div class="d-grid">

<button

id="loginBtn"

type="submit"

class="btn btn-primary btn-lg">

<span id="loginText">

Login

</span>

<span

id="loginSpinner"

class="spinner-border spinner-border-sm ms-2 d-none">

</span>

</button>

</div>

</form>

</div>

  <!-- =======================================
     Login Alert
======================================= -->

<div

    id="loginAlert"

    class="alert alert-danger mt-4 d-none"

    role="alert">

    Invalid administrator credentials.

</div>

<div

    id="successAlert"

    class="alert alert-success mt-3 d-none"

    role="alert">

    Login successful.

</div>

</div>

</div>

</div>

</div>

<!-- =======================================
     Loading Overlay
======================================= -->

<div

    id="loadingOverlay"

    class="position-fixed top-0 start-0 w-100 h-100 bg-dark bg-opacity-50 d-none"

    style="z-index:9999;">

    <div

        class="d-flex justify-content-center align-items-center h-100">

        <div class="text-center">

            <div

                class="spinner-border text-light"

                role="status">

            </div>

            <div class="text-white mt-3">

                Signing in...

            </div>

        </div>

    </div>

</div>

<!-- =======================================
     Forgot Password Modal
======================================= -->

<div

    class="modal fade"

    id="forgotPasswordModal"

    tabindex="-1"

    aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">

                    Reset Administrator Password

                </h5>

                <button

                    class="btn-close"

                    data-bs-dismiss="modal">

                </button>

            </div>

            <div class="modal-body">

                <p class="text-muted">

                    Enter your administrator email address.

                </p>

                <input

                    id="resetEmail"

                    type="email"

                    class="form-control"

                    placeholder="admin@example.com">

            </div>

            <div class="modal-footer">

                <button

                    class="btn btn-secondary"

                    data-bs-dismiss="modal">

                    Cancel

                </button>

                <button

                    id="sendResetBtn"

                    class="btn btn-primary">

                    Send Reset Link

                </button>

            </div>

        </div>

    </div>

</div>

<!-- =======================================
     Toast Notifications
======================================= -->

<div class="toast-container position-fixed top-0 end-0 p-3">

    <div

        id="successToast"

        class="toast text-bg-success border-0">

        <div class="d-flex">

            <div

                id="successToastMessage"

                class="toast-body">

                Success

            </div>

            <button

                class="btn-close btn-close-white me-2 m-auto"

                data-bs-dismiss="toast">

            </button>

        </div>

    </div>

    <div

        id="errorToast"

        class="toast text-bg-danger border-0 mt-2">

        <div class="d-flex">

            <div

                id="errorToastMessage"

                class="toast-body">

                Error

            </div>

            <button

                class="btn-close btn-close-white me-2 m-auto"

                data-bs-dismiss="toast">

            </button>

        </div>

    </div>

</div>

<!-- =======================================
     Offline Banner
======================================= -->

<div

    id="offlineBanner"

    class="alert alert-warning text-center rounded-0 mb-0 d-none">

    <i class="bi bi-wifi-off me-2"></i>

    You are currently offline.

</div>

<!-- =======================================
     Footer
======================================= -->

<footer class="text-center py-4 text-muted">

    ©

    <span id="copyrightYear"></span>

    Kenya Gas Marketplace

    <br>

    Secure Administrator Login

</footer>

<!-- =======================================
     Bootstrap
======================================= -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- =======================================
     Admin Login JavaScript
======================================= -->

<script

    type="module"

    src="assets/js/admin-login.js">

</script>

<script>

document.getElementById(

    "copyrightYear"

).textContent =

new Date().getFullYear();

</script>

</body>

</html>
